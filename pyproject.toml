[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-lab"
version = "0.1.0"
description = "Portable CPU implementations of validated arXiv-paper findings for local AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lesterppo" }]
dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
